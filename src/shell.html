<title>Action Register</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<div class="app">
  <aside class="rail" aria-label="Main">
    <div class="brand"><span class="brand-mark">/*BRAND*/</span><div><div class="brand-name">Action Register</div><div class="brand-sub">Email → tasks, with evidence</div></div></div>
    <button class="nav" data-nav="todo">/*I_TODO*/To-do<span class="count" data-count="todo" hidden></span></button>
    <button class="nav" data-nav="review">/*I_REVIEW*/Review<span class="count" data-count="review" hidden></span></button>
    <button class="nav" data-nav="import">/*I_UPLOAD*/Add emails</button>
    <button class="nav" data-nav="emails">/*I_MAIL*/Emails</button>
    <button class="nav" data-nav="setup">/*I_GEAR*/Setup</button>
    <div class="rail-foot"><div id="storage-mode"><span class="dot off"></span>Connecting…</div><div>No mailbox access. You approve every task.</div></div>
  </aside>
  <div style="min-width:0">
    <header class="topbar"><div class="brand"><span class="brand-mark">/*BRAND*/</span><div class="brand-name">Action Register</div></div><span class="spacer"></span><button class="icon-btn" data-nav="setup" aria-label="Setup">/*I_GEAR*/</button></header>
    <main id="main"></main>
  </div>
  <nav class="tabbar" aria-label="Main">
    <button class="tab" data-nav="todo">/*I_TODO*/To-do</button>
    <button class="tab" data-nav="review">/*I_REVIEW*/Review<span class="badge" data-count="review" hidden></span></button>
    <button class="tab" data-nav="import">/*I_UPLOAD*/Add</button>
    <button class="tab" data-nav="emails">/*I_MAIL*/Emails</button>
  </nav>
</div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Details"></aside>
<div class="modal" id="modal" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
