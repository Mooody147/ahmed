name: Desktop app

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - name: Desktop end-to-end test
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          xvfb-run -a npm run test:desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-e2e-screenshots
          path: test/desktop/out/

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: action-register-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error
