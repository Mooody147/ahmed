name: Share-link viewer (GitHub Pages)

# Publishes viewer/ — the read-only page that canvas share links open on a phone or tablet — at
# https://<owner>.github.io/<repo>/. One-time: Settings › Pages › Source: GitHub Actions.
on:
  push:
    paths: ['viewer/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: viewer
      - id: deployment
        uses: actions/deploy-pages@v4
