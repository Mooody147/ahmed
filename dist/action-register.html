<title>Action Register</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: a working register — left rail + one work column on desktop; top bar + bottom tabs on phones.
   Rows are ruled like a document register; refs and locations are set in mono like drawing numbers. */
:root {
  --bg: #EEF2F1; --surface: #FFFFFF; --sunken: #E4EAE8; --ink: #15201E; --ink-2: #46524F; --ink-3: #75817E; --line: #D3DBD8; --line-2: #E3E9E7;
  --accent: #0A6B74; --accent-2: #085A62; --accent-ink: #FFFFFF; --accent-soft: #D5EBEB;
  --crit: #B3261E; --crit-soft: #FBE3E0; --high: #B9540B; --high-soft: #FCEADB; --med: #2C6AA3; --med-soft: #E0EBF6; --low: #6B7876; --low-soft: #E8EDEC;
  --ok: #1D7A4C; --ok-soft: #DCF0E4; --wait: #6A4DAE; --wait-soft: #EAE4F7; --warn: #8F6200; --warn-soft: #FAEFD2;
  --shadow: 0 1px 2px rgba(16,32,30,.06), 0 8px 24px rgba(16,32,30,.08);
  --f-display: 'IBM Plex Sans Condensed', 'IBM Plex Sans Arabic', 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
  --f-body: 'IBM Plex Sans', 'IBM Plex Sans Arabic', system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans Arabic', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace;
  --r: 8px; --rail: 232px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1413; --surface: #151D1C; --sunken: #0A0F0E; --ink: #E3EBE9; --ink-2: #A8B6B3; --ink-3: #7B8986; --line: #2A3533; --line-2: #212B29;
  --accent: #52B4BD; --accent-2: #6CC4CC; --accent-ink: #062022; --accent-soft: #143537;
  --crit: #F2887C; --crit-soft: #3A1916; --high: #EFA25C; --high-soft: #382413; --med: #81B3E6; --med-soft: #16293B; --low: #97A4A1; --low-soft: #1D2726;
  --ok: #5DC48E; --ok-soft: #12301F; --wait: #B69FF2; --wait-soft: #251D3A; --warn: #E2B544; --warn-soft: #30280E;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1413; --surface: #151D1C; --sunken: #0A0F0E; --ink: #E3EBE9; --ink-2: #A8B6B3; --ink-3: #7B8986; --line: #2A3533; --line-2: #212B29;
  --accent: #52B4BD; --accent-2: #6CC4CC; --accent-ink: #062022; --accent-soft: #143537;
  --crit: #F2887C; --crit-soft: #3A1916; --high: #EFA25C; --high-soft: #382413; --med: #81B3E6; --med-soft: #16293B; --low: #97A4A1; --low-soft: #1D2726;
  --ok: #5DC48E; --ok-soft: #12301F; --wait: #B69FF2; --wait-soft: #251D3A; --warn: #E2B544; --warn-soft: #30280E;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; letter-spacing: .005em; text-wrap: balance; margin: 0; }
.mono { font-family: var(--f-mono); font-size: .86em; letter-spacing: -.01em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.small { font-size: 12.5px; }
.label { font-family: var(--f-display); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
a { color: var(--accent); }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100%; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 4px; padding: 18px 12px 14px max(12px, env(safe-area-inset-left, 0px)); border-right: 1px solid var(--line); background: var(--surface); }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px 16px; }
.brand-mark { width: 30px; height: 30px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.brand-name { font-family: var(--f-display); font-weight: 700; font-size: 17px; line-height: 1.1; }
.brand-sub { font-size: 11.5px; color: var(--ink-3); }
.nav { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 7px; background: none; text-align: left; color: var(--ink-2); font-weight: 500; }
.nav:hover { background: var(--sunken); color: var(--ink); }
.nav[aria-current="page"] { background: var(--accent-soft); color: var(--accent-2); }
.nav svg { flex: none; }
.nav .count { margin-left: auto; font-size: 12px; font-variant-numeric: tabular-nums; min-width: 22px; padding: 0 6px; border-radius: 99px; background: var(--sunken); text-align: center; color: var(--ink-2); }
.nav .count.hot { background: var(--accent); color: var(--accent-ink); }
.rail-foot { margin-top: auto; padding: 10px 8px 0; border-top: 1px solid var(--line-2); font-size: 12px; color: var(--ink-3); display: grid; gap: 6px; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-right: 6px; vertical-align: 1px; }
.dot.local { background: var(--warn); } .dot.off { background: var(--ink-3); }

.topbar { display: none; }
.tabbar { display: none; }
main { min-width: 0; padding-block: 22px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 18px; }
.page-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px 16px; }
.page-head h1 { font-size: 26px; line-height: 1.15; }
.page-head .sub { color: var(--ink-2); margin-top: 2px; }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .topbar { display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; align-items: center; gap: 10px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); }
  .topbar .brand { padding: 0; } .topbar .brand-mark { width: 26px; height: 26px; }
  .topbar .spacer { flex: 1; }
  .tabbar { display: grid; grid-template-columns: repeat(6, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding: 4px max(8px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  .tab { display: grid; justify-items: center; gap: 1px; border: 0; background: none; padding: 6px 2px; font-size: 11px; color: var(--ink-3); position: relative; }
  .tab[aria-current="page"] { color: var(--accent); }
  .tab .badge { position: absolute; top: 2px; left: calc(50% + 6px); background: var(--accent); color: var(--accent-ink); font-size: 10px; min-width: 16px; padding: 0 4px; border-radius: 99px; line-height: 16px; }
  main { padding-block: 14px calc(84px + env(safe-area-inset-bottom, 0px)); }
  .page-head h1 { font-size: 22px; }
}

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn.ghost { border-color: transparent; background: none; color: var(--ink-2); }
.btn.ghost:hover { background: var(--sunken); }
.btn.danger { color: var(--crit); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.icon-btn { width: 34px; height: 34px; display: inline-grid; place-items: center; border-radius: 7px; border: 0; background: none; color: var(--ink-2); }
.icon-btn:hover { background: var(--sunken); }
.input, select.input, textarea.input { width: 100%; min-width: 0; height: 36px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); }
textarea.input { height: auto; min-height: 76px; padding: 8px 10px; resize: vertical; line-height: 1.45; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: 12px; color: var(--ink-3); font-weight: 500; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 12px; }
@media (max-width: 640px) { .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } }
.check { display: inline-flex; gap: 8px; align-items: flex-start; cursor: pointer; }
.check input { margin-top: 3px; accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.spacer { flex: 1; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.pad { padding: 16px; }
.section-title { display: flex; align-items: baseline; gap: 10px; }
.section-title h2 { font-size: 17px; }

/* ---------- chips & pills ---------- */
.chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 99px; font-size: 12px; font-weight: 500; background: var(--sunken); color: var(--ink-2); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.chip.crit { background: var(--crit-soft); color: var(--crit); } .chip.high { background: var(--high-soft); color: var(--high); }
.chip.med { background: var(--med-soft); color: var(--med); } .chip.low { background: var(--low-soft); color: var(--low); }
.chip.ok { background: var(--ok-soft); color: var(--ok); } .chip.wait { background: var(--wait-soft); color: var(--wait); }
.chip.warn { background: var(--warn-soft); color: var(--warn); } .chip.accent { background: var(--accent-soft); color: var(--accent-2); }
.chip.proj { background: none; border: 1px solid var(--line); color: var(--ink-2); font-family: var(--f-mono); font-size: 11.5px; }

/* ---------- lenses ---------- */
.lenses { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.lenses::-webkit-scrollbar { display: none; }
.lens { flex: none; display: grid; gap: 0; min-width: 104px; padding: 9px 12px 8px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); text-align: left; }
.lens .n { font-family: var(--f-display); font-size: 24px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.lens .t { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.lens[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.lens.over .n { color: var(--crit); } .lens.today .n { color: var(--high); } .lens.wait .n { color: var(--wait); } .lens.blocked .n { color: var(--crit); } .lens.done .n { color: var(--ok); }
.lens.zero .n { color: var(--ink-3); }

.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toolbar .search { flex: 1 1 220px; position: relative; }
.toolbar .search svg { position: absolute; left: 10px; top: 10px; color: var(--ink-3); }
.toolbar .search .input { padding-left: 32px; }
.toolbar select.input { width: auto; flex: 0 1 auto; max-width: 180px; }

/* ---------- register list ---------- */
.register { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.group-h { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: var(--sunken); border-bottom: 1px solid var(--line-2); }
.group-h .label { color: var(--ink-2); }
.group-h.over .label { color: var(--crit); }
.trow { display: grid; grid-template-columns: 4px 34px minmax(0, 1fr) auto; align-items: center; gap: 0 10px; padding: 10px 14px 10px 0; border-bottom: 1px solid var(--line-2); cursor: pointer; }
.trow:last-child { border-bottom: 0; }
.trow:hover { background: color-mix(in srgb, var(--sunken) 55%, transparent); }
.trow .stripe { align-self: stretch; margin: -10px 0; }
.p-critical .stripe { background: var(--crit); } .p-high .stripe { background: var(--high); } .p-medium .stripe { background: var(--med); } .p-low .stripe { background: var(--line); }
.tick { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--ink-3); background: none; display: grid; place-items: center; padding: 0; margin-left: 8px; color: transparent; }
.tick:hover { border-color: var(--ok); color: var(--ok); }
.trow.is-done .tick { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.trow.is-done .ttl { text-decoration: line-through; color: var(--ink-3); }
.tmain { min-width: 0; display: grid; gap: 3px; }
.ttl { font-weight: 550; line-height: 1.35; overflow-wrap: anywhere; }
.tmeta { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 12.5px; color: var(--ink-3); min-width: 0; }
.tmeta .ref { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-2); }
.tmeta .src { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 280px; }
.tside { display: grid; justify-items: end; gap: 4px; text-align: right; }
.due { font-size: 12.5px; font-variant-numeric: tabular-nums; font-weight: 500; white-space: nowrap; color: var(--ink-2); }
.due.over { color: var(--crit); } .due.today { color: var(--high); } .due.soon { color: var(--ink); } .due.none { color: var(--ink-3); font-weight: 400; }
@media (max-width: 560px) { .tmeta .src { max-width: 180px; } .tside .chip { display: none; } }

.empty { padding: 34px 20px; text-align: center; display: grid; justify-items: center; gap: 10px; color: var(--ink-2); }
.empty h3 { font-size: 18px; color: var(--ink); }
.empty p { max-width: 54ch; margin: 0; }

/* ---------- drawer ---------- */
.scrim { position: fixed; inset: 0; background: rgba(8,16,15,.38); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); z-index: 41; background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.drawer-h { display: flex; align-items: center; gap: 8px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px 16px; border-bottom: 1px solid var(--line); }
.drawer-b { overflow-y: auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) 16px; display: grid; gap: 16px; align-content: start; }
.title-edit { font-family: var(--f-display); font-size: 21px; font-weight: 600; line-height: 1.25; border: 1px solid transparent; border-radius: 7px; padding: 4px 6px; margin: -4px -6px; width: calc(100% + 12px); background: none; resize: none; overflow: hidden; }
.title-edit:hover { border-color: var(--line); } .title-edit:focus { outline: none; border-color: var(--accent); }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; padding: 2px; gap: 2px; background: var(--sunken); }
.seg button { border: 0; background: none; padding: 5px 10px; border-radius: 6px; font-size: 13px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); font-weight: 600; }
@media (prefers-reduced-motion: no-preference) { .drawer { animation: slidein .18s ease-out; } @keyframes slidein { from { transform: translateX(24px); opacity: .6; } } }

/* evidence */
.evidence { display: grid; gap: 8px; }
.ev { border: 1px solid var(--line-2); border-radius: 7px; padding: 8px 10px; display: grid; gap: 4px; background: var(--bg); }
.ev-h { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; color: var(--ink-3); }
.ev-h .loc { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-2); }
.ev q { quotes: "“" "”"; font-size: 13.5px; color: var(--ink); overflow-wrap: anywhere; }
.ev-badge { font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 4px; line-height: 18px; }
.ev-badge.verified { background: var(--ok-soft); color: var(--ok); }
.ev-badge.partial, .ev-badge.visual { background: var(--med-soft); color: var(--med); }
.ev-badge.not_found, .ev-badge.unknown_source, .ev-badge.no_quote { background: var(--warn-soft); color: var(--warn); }

.history { display: grid; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
.history div { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 8px; }
.history time { color: var(--ink-3); font-variant-numeric: tabular-nums; }

/* ---------- import ---------- */
.drop { border: 1.5px dashed var(--ink-3); border-radius: 12px; padding: 26px 18px; display: grid; justify-items: center; gap: 10px; text-align: center; background: var(--surface); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop h2 { font-size: 19px; }
.drop p { margin: 0; color: var(--ink-2); max-width: 60ch; }
.formats { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.howto { display: grid; gap: 4px; }
.howto summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
.howto ol { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 6px; color: var(--ink-2); }
.bundle { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.bundle-h { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 14px; border-bottom: 1px solid var(--line-2); }
.bundle-h .subj { font-weight: 600; overflow-wrap: anywhere; }
.bundle-h .meta { font-size: 12.5px; color: var(--ink-3); overflow-wrap: anywhere; }
.att { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 4px 10px; align-items: start; padding: 9px 14px; border-bottom: 1px solid var(--line-2); }
.att:last-child { border-bottom: 0; }
.att .name { overflow-wrap: anywhere; font-size: 13.5px; }
.att .note { font-size: 12px; color: var(--ink-3); }
.att .att-side { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.att.off .name { color: var(--ink-3); text-decoration: line-through; }
.preview { grid-column: 2 / -1; max-height: 240px; overflow: auto; background: var(--bg); border: 1px solid var(--line-2); border-radius: 6px; padding: 8px 10px; font-family: var(--f-mono); font-size: 11.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
.progress { height: 4px; background: var(--sunken); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); width: 30%; }
@media (prefers-reduced-motion: no-preference) { .progress.indet i { animation: indet 1.2s ease-in-out infinite; } @keyframes indet { from { transform: translateX(-100%); } to { transform: translateX(340%); } } }
.callout { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 8px; padding: 10px 12px; border-radius: 7px; font-size: 13.5px; }
.callout.warn { background: var(--warn-soft); color: var(--ink); } .callout.warn svg { color: var(--warn); }
.callout.info { background: var(--accent-soft); } .callout.info svg { color: var(--accent-2); }
.callout.ok { background: var(--ok-soft); } .callout.ok svg { color: var(--ok); }
.callout.crit { background: var(--crit-soft); } .callout.crit svg { color: var(--crit); }
.callout p { margin: 0; }
.callout ul { margin: 4px 0 0; padding-left: 18px; }

/* ---------- review ---------- */
.rv { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.rv-h { padding: 14px 16px; display: grid; gap: 6px; border-bottom: 1px solid var(--line-2); }
.rv-h .subj { font-family: var(--f-display); font-size: 18px; font-weight: 600; overflow-wrap: anywhere; }
.rv-b { padding: 14px 16px; display: grid; gap: 12px; }
.prop { border: 1px solid var(--line); border-radius: 8px; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 0 6px; padding: 12px 12px 12px 8px; }
.prop.off { opacity: .62; }
.prop.off:hover { opacity: .85; }
.prop .body { display: grid; gap: 10px; min-width: 0; }
.prop .ptitle { font-weight: 600; font-size: 15px; }
.prop-flags { display: flex; flex-wrap: wrap; gap: 6px; }
.rv-f { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line-2); background: var(--bg); }
details.more > summary { cursor: pointer; color: var(--accent); font-size: 13px; list-style: none; }
details.more > summary::-webkit-details-marker { display: none; }
.dup { border-radius: 7px; background: var(--wait-soft); padding: 8px 10px; display: grid; gap: 6px; font-size: 13px; }

/* ---------- emails ---------- */
.erow { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 2px 12px; padding: 11px 14px; border-bottom: 1px solid var(--line-2); cursor: pointer; align-items: start; }
.erow:hover { background: color-mix(in srgb, var(--sunken) 55%, transparent); }
.erow time { font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; padding-top: 1px; }
.erow .s { font-weight: 550; overflow-wrap: anywhere; }
.erow .f { font-size: 12.5px; color: var(--ink-3); overflow-wrap: anywhere; }
@media (max-width: 560px) { .att { grid-template-columns: 22px minmax(0, 1fr); } .att .att-side { grid-column: 2; justify-content: flex-start; } .erow { grid-template-columns: minmax(0, 1fr) auto; } .erow time { grid-column: 1 / -1; } }
.bodytext { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13.5px; background: var(--bg); border: 1px solid var(--line-2); border-radius: 7px; padding: 10px 12px; max-height: 420px; overflow: auto; }

/* ---------- settings ---------- */
.settings { display: grid; gap: 16px; }
.settings .card { display: grid; gap: 12px; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: 13px; }
.kv dt { color: var(--ink-3); } .kv dd { margin: 0; }

/* ---------- toasts ---------- */
.toasts { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; width: min(440px, calc(100% - 32px)); }
@media (max-width: 860px) { .toasts { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); } }
.toast { display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 14px; border-radius: 9px; background: var(--ink); color: var(--bg); box-shadow: var(--shadow); font-size: 13.5px; }
.toast .btn { height: 28px; background: none; border-color: transparent; color: var(--accent-soft); font-weight: 600; }
.toast.err { background: var(--crit); color: #fff; }

.modal { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 16px; background: rgba(8,16,15,.45); }
.modal .card { width: min(640px, 100%); max-height: 86vh; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
.modal .card > * { padding: 14px 16px; }
.modal textarea { width: 100%; height: 100%; min-height: 240px; font-family: var(--f-mono); font-size: 12px; }
.hide-sm { } @media (max-width: 560px) { .hide-sm { display: none !important; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.fwd-addr { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 14px; border-radius: 8px; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
.fwd-addr > div { flex: 1 1 220px; }
.fwd-addr .addr { font-size: 17px; font-weight: 500; color: var(--ink); overflow-wrap: anywhere; user-select: all; -webkit-user-select: all; margin-top: 2px; }

/* ---------- to-do ---------- */
.todo-bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.seg-label { align-self: center; padding: 0 8px 0 6px; font-size: 12px; color: var(--ink-3); }
.todo-groups { display: grid; gap: 12px; }
.todo-group { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.todo-gh { width: 100%; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 0; background: var(--sunken); text-align: left; }
.todo-gh .caret { width: 12px; color: var(--ink-3); font-size: 12px; }
.todo-gh .gname { font-family: var(--f-display); font-weight: 600; font-size: 16px; min-width: 0; overflow-wrap: anywhere; }
.todo-gh .gstats { margin-left: auto; display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.todo-items { list-style: none; margin: 0; padding: 0; }
.todo-item { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 0 6px; padding: 11px 14px 11px 6px; border-top: 1px solid var(--line-2); border-left: 3px solid transparent; }
.todo-item.p-critical { border-left-color: var(--crit); } .todo-item.p-high { border-left-color: var(--high); }
.todo-item .tick { margin-top: 1px; }
.todo-main { min-width: 0; display: grid; gap: 4px; cursor: pointer; }
.todo-top { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; }
.todo-top .ttl { font-weight: 550; overflow-wrap: anywhere; }
.todo-next { font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
.todo-item.is-done .ttl { text-decoration: line-through; color: var(--ink-3); }
.todo-item.is-done .tick { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.over-txt { color: var(--crit); font-weight: 600; }
@media (max-width: 860px) { .tabbar { grid-template-columns: repeat(6, 1fr); } }
@media (max-width: 560px) { .todo-gh .gstats .muted { display: none; } }

.todo-search { position: relative; flex: 1 1 220px; min-width: 0; }
.todo-search svg { position: absolute; left: 10px; top: 10px; color: var(--ink-3); }
.todo-search .input { padding-left: 32px; }
.todo-bar > .row { flex: 1 1 100%; }
@media (min-width: 1000px) { .todo-bar > .row { flex: 0 1 auto; } }

/* ================= premium skin: depth, illustration, 3D board ================= */
:root {
  --ill-sky1: #DDF0F0; --ill-sky2: #F4FAF9; --ill-sun: #F6C453; --ill-ground: #CFDCD8; --ill-tank: #9FB4B0; --ill-water1: #4FB3BF; --ill-water2: #1E7F8C;
  --ill-steel: #5B6B69; --ill-pipe: #3A8FA0; --ill-pump: #0A6B74; --ill-bubble: #E9FAFA; --ill-card: #FFFFFF; --ill-line: #C9D6D3;
  --grid-line: rgba(10, 107, 116, .055); --elev-1: 0 1px 2px rgba(16,32,30,.06), 0 4px 12px -4px rgba(16,32,30,.10);
  --elev-2: 0 2px 4px rgba(16,32,30,.06), 0 14px 32px -12px rgba(16,32,30,.28); --elev-3: 0 4px 8px rgba(16,32,30,.08), 0 26px 48px -18px rgba(16,32,30,.38);
  --face-top: rgba(255,255,255,.9); --g-l: 46%; --g-l-soft: 93%; --g-s: 62%;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ill-sky1: #10292B; --ill-sky2: #0E1A1A; --ill-sun: #D9A53A; --ill-ground: #1B2928; --ill-tank: #3A4D4A; --ill-water1: #2C8D98; --ill-water2: #145E67;
  --ill-steel: #8FA3A0; --ill-pipe: #3D9EB0; --ill-pump: #52B4BD; --ill-bubble: #BFEFF2; --ill-card: #1C2827; --ill-line: #364543;
  --grid-line: rgba(82, 180, 189, .05); --elev-1: 0 1px 2px rgba(0,0,0,.4), 0 4px 12px -4px rgba(0,0,0,.5);
  --elev-2: 0 2px 4px rgba(0,0,0,.35), 0 14px 32px -12px rgba(0,0,0,.7); --elev-3: 0 4px 8px rgba(0,0,0,.4), 0 26px 48px -18px rgba(0,0,0,.8);
  --face-top: rgba(255,255,255,.05); --g-l: 64%; --g-l-soft: 17%; --g-s: 48%; } }
:root[data-theme="dark"] {
  --ill-sky1: #10292B; --ill-sky2: #0E1A1A; --ill-sun: #D9A53A; --ill-ground: #1B2928; --ill-tank: #3A4D4A; --ill-water1: #2C8D98; --ill-water2: #145E67;
  --ill-steel: #8FA3A0; --ill-pipe: #3D9EB0; --ill-pump: #52B4BD; --ill-bubble: #BFEFF2; --ill-card: #1C2827; --ill-line: #364543;
  --grid-line: rgba(82, 180, 189, .05); --elev-1: 0 1px 2px rgba(0,0,0,.4), 0 4px 12px -4px rgba(0,0,0,.5);
  --elev-2: 0 2px 4px rgba(0,0,0,.35), 0 14px 32px -12px rgba(0,0,0,.7); --elev-3: 0 4px 8px rgba(0,0,0,.4), 0 26px 48px -18px rgba(0,0,0,.8);
  --face-top: rgba(255,255,255,.05); --g-l: 64%; --g-l-soft: 17%; --g-s: 48%; }

body { background-color: var(--bg); background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px); background-size: 28px 28px; background-attachment: fixed; }
.card, .register, .bundle, .rv { box-shadow: var(--elev-1); }
.btn.primary { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 88%, #fff) 0%, var(--accent) 100%); box-shadow: 0 1px 0 rgba(255,255,255,.25) inset, 0 4px 10px -4px color-mix(in srgb, var(--accent) 70%, transparent); }
.brand-mark { background: linear-gradient(145deg, #2CB5C0 0%, var(--accent) 55%, #064C53 100%); box-shadow: 0 6px 14px -6px rgba(10,107,116,.7), 0 1px 0 rgba(255,255,255,.35) inset; border-radius: 9px; }
.rail { background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); }
.nav[aria-current="page"] { box-shadow: inset 3px 0 0 var(--accent); }
.big-emoji { font-size: 40px; line-height: 1; }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 18px 28px; align-items: center; padding: 22px 24px; border-radius: 18px; background: linear-gradient(135deg, var(--surface) 0%, color-mix(in srgb, var(--accent-soft) 70%, var(--surface)) 100%); border: 1px solid var(--line); box-shadow: var(--elev-2); overflow: hidden; position: relative; }
.hero h1 { font-size: clamp(24px, 3.4vw, 32px); line-height: 1.12; margin-top: 4px; }
.hero-sub { margin: 8px 0 14px; color: var(--ink-2); font-size: 15px; max-width: 52ch; }
.hero-art .illo { width: 100%; height: auto; display: block; border-radius: 14px; box-shadow: var(--elev-1); }
.review-btn { border-color: var(--accent); color: var(--accent-2); font-weight: 600; }
@media (max-width: 720px) { .hero { grid-template-columns: minmax(0, 1fr); padding: 18px; } .hero-art { order: -1; } }

/* stat tiles (3D keys) */
.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 560px) { .tiles { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; padding: 2px 2px 10px; margin: 0 -2px; scrollbar-width: none; } .tiles::-webkit-scrollbar { display: none; } .tile { flex: 0 0 132px; scroll-snap-align: start; } }
.tile { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; gap: 0 10px; align-items: center; text-align: left; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: linear-gradient(180deg, var(--face-top), transparent 60%), var(--surface); box-shadow: 0 1px 0 var(--line), 0 6px 0 -1px color-mix(in srgb, var(--line) 85%, transparent), var(--elev-1); transform: translateY(0); transition: transform .15s ease, box-shadow .15s ease; }
.tile:hover { transform: translateY(-2px); box-shadow: 0 1px 0 var(--line), 0 8px 0 -1px color-mix(in srgb, var(--line) 85%, transparent), var(--elev-2); }
.tile:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line), 0 2px 0 -1px var(--line), var(--elev-1); }
.tile[aria-pressed="true"] { border-color: var(--accent); background: linear-gradient(180deg, var(--face-top), transparent 60%), var(--accent-soft); }
.tile-e { grid-row: 1 / 3; font-size: 24px; line-height: 1; }
.tile-n { font-family: var(--f-display); font-size: 24px; font-weight: 700; line-height: 1.05; }
.tile-l { font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile.over:not(.zero) .tile-n { color: var(--crit); } .tile.today:not(.zero) .tile-n { color: var(--high); } .tile.wait:not(.zero) .tile-n { color: var(--wait); }
.tile.zero .tile-n { color: var(--ink-3); }

.todo-bar { gap: 10px 12px; }
.todo-bar .seg { box-shadow: var(--elev-1); }
.todo-search { flex: 1 1 240px; }
.todo-opts { flex: 1 1 100%; }

/* project badges & icons */
.pbadge { display: inline-grid; place-items: center; flex: none; width: 40px; height: 40px; border-radius: 11px; font-family: var(--f-display); font-weight: 700; font-size: 14px; letter-spacing: .02em; color: #fff; background: linear-gradient(145deg, hsl(var(--h) 70% 58%), hsl(var(--h) 62% 36%)); box-shadow: 0 6px 14px -6px hsl(var(--h) 60% 30% / .8), 0 1px 0 rgba(255,255,255,.35) inset, 0 -2px 0 rgba(0,0,0,.15) inset; }
.gicon { display: inline-grid; place-items: center; flex: none; width: 40px; height: 40px; border-radius: 11px; font-size: 22px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--elev-1); }
.gicon.disc { color: hsl(var(--h) var(--g-s) var(--g-l)); background: hsl(var(--h) 60% var(--g-l-soft)); border-color: transparent; }
.dicon .f { fill: currentColor; fill-opacity: .22; } .dicon .s2 { opacity: .55; }
.chip.dchip { gap: 5px; } .chip.dchip .dicon { color: var(--accent-2); }
.chip.pchip i { width: 8px; height: 8px; border-radius: 3px; background: hsl(var(--h) 60% 48%); }
.chip.pchip { background: hsl(var(--h) 60% var(--g-l-soft)); color: var(--ink); }

/* progress ring */
.ring { position: relative; display: inline-grid; place-items: center; flex: none; }
.ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 3.6; }
.ring-bg { stroke: var(--line); } .ring-fg { stroke: hsl(var(--h, 186) var(--g-s) var(--g-l)); stroke-linecap: round; transition: stroke-dasharray .4s ease; }
.ring b { font-size: 10.5px; font-variant-numeric: tabular-nums; color: var(--ink-2); }

/* board */
.board { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 18px; align-items: start; perspective: 1600px; }
.stack { border-radius: 18px; background: linear-gradient(180deg, hsl(var(--h) 55% var(--g-l-soft)) 0, var(--surface) 110px); border: 1px solid color-mix(in srgb, hsl(var(--h) 50% 50%) 22%, var(--line)); box-shadow: var(--elev-2), 0 1px 0 var(--face-top) inset; overflow: visible; transform-style: preserve-3d; }
.stack-h { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 14px 12px; border: 0; background: none; text-align: left; border-radius: 18px 18px 0 0; }
.stack-t { display: grid; gap: 1px; min-width: 0; flex: 1; }
.stack-t .gname { font-family: var(--f-display); font-weight: 700; font-size: 17px; line-height: 1.2; overflow-wrap: anywhere; }
.stack-t .gsub { font-size: 12.5px; color: var(--ink-2); }
.stack-b { display: grid; gap: 14px; padding: 4px 14px 18px; }
.stack.flat { background: var(--surface); }
.todo-groups-list { display: grid; gap: 14px; }

/* 3D task cards */
.tcard { position: relative; transform-style: preserve-3d; transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .18s ease-out; margin-bottom: calc(var(--depth) * 4px); margin-right: calc(var(--depth) * 4px); }
.tface { position: relative; z-index: 3; display: grid; gap: 8px; padding: 12px 14px 13px; border-radius: 14px; background: linear-gradient(180deg, var(--face-top), transparent 42%), var(--surface); border: 1px solid var(--line); box-shadow: var(--elev-1); transition: box-shadow .18s ease, transform .18s ease; }
.tcard:hover .tface { box-shadow: var(--elev-3); transform: translateZ(14px); }
.tcard.p-critical .tface { border-left: 4px solid var(--crit); } .tcard.p-high .tface { border-left: 4px solid var(--high); } .tcard.p-medium .tface { border-left: 4px solid var(--med); } .tcard.p-low .tface { border-left: 4px solid var(--line); }
.sheet { position: absolute; inset: 0; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--elev-1); }
.sheet.s1 { transform: translate(4px, 4px) translateZ(-6px); z-index: 2; background: color-mix(in srgb, var(--surface) 92%, var(--line)); }
.sheet.s2 { transform: translate(8px, 8px) translateZ(-12px); z-index: 1; background: color-mix(in srgb, var(--surface) 84%, var(--line)); }
.sheet.s3 { transform: translate(12px, 12px) translateZ(-18px); z-index: 0; background: color-mix(in srgb, var(--surface) 76%, var(--line)); }
.tc-top { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 4px; align-items: start; }
.tc-top .tick { margin: 0; }
.tc-title { font-weight: 600; font-size: 15px; line-height: 1.35; cursor: pointer; overflow-wrap: anywhere; }
.tc-title:hover { color: var(--accent-2); }
.tc-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding-left: 34px; font-size: 12.5px; }
.tc-meta .ref { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3); }
.stackcount { font-size: 12px; color: var(--ink-2); font-weight: 500; }
.tc-next { padding-left: 34px; font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
.tc-chips { display: flex; flex-wrap: wrap; gap: 6px; padding-left: 34px; }
.duepill { display: inline-flex; align-items: center; gap: 2px; height: 22px; padding: 0 9px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--sunken); color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.duepill.over { background: var(--crit-soft); color: var(--crit); } .duepill.today { background: var(--high-soft); color: var(--high); } .duepill.soon { background: var(--med-soft); color: var(--med); } .duepill.none { font-weight: 500; color: var(--ink-3); }
.tcard.is-done .tc-title { text-decoration: line-through; color: var(--ink-3); }
.tcard.is-done .tick { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.tcard.is-done .tface { opacity: .72; }

/* sub-items */
.subs { margin-left: 34px; display: grid; gap: 6px; padding: 8px 10px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line-2); }
.todo-main .subs { margin-left: 0; }
.subs-h { display: flex; align-items: center; gap: 10px; }
.subbar { flex: 1; height: 7px; border-radius: 99px; background: var(--sunken); overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,.08); }
.subbar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 60%, #6DE0C5)); transition: width .35s ease; }
.sublist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.sublist li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 6px; align-items: start; font-size: 13px; line-height: 1.4; }
.sublist li.done > span { text-decoration: line-through; color: var(--ink-3); }
.subtick { width: 18px; height: 18px; margin-top: 1px; border-radius: 5px; border: 1.5px solid var(--ink-3); background: var(--surface); display: grid; place-items: center; padding: 0; color: transparent; }
.subtick svg { width: 12px; height: 12px; }
.subtick[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.subtick:hover { border-color: var(--accent); }
.subs-more { justify-self: start; padding: 0 6px; height: 26px; }
.sublist.edit li { grid-template-columns: 22px minmax(0, 1fr) 34px; align-items: center; }
.sublist.edit .sub-in { height: 32px; }
.rv-subs { margin: 0; padding-left: 20px; display: grid; gap: 3px; }

/* list mode refinements */
.stack.flat .todo-items { border-top: 1px solid var(--line-2); }
.todo-item .tick { margin-top: 2px; }

/* empty hero */
.empty-hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 20px; padding: 20px; align-items: center; }
.empty-hero h3 { font-family: var(--f-display); font-size: 20px; margin: 0 0 6px; }
.empty-hero .illo { width: 100%; height: auto; border-radius: 14px; }
@media (max-width: 720px) { .empty-hero { grid-template-columns: minmax(0, 1fr); } }

@media (prefers-reduced-motion: reduce) { .tcard, .tface, .tile, .subbar i { transition: none !important; } .tcard { transform: none !important; } }

/* ================= mind map ================= */
.hero.compact { grid-template-columns: minmax(0, 1fr); padding: 16px 20px; }
.hero.compact h1 { font-size: clamp(20px, 2.6vw, 26px); }
.hero.compact .hero-sub { margin: 4px 0 10px; }
.mode-bar { display: flex; justify-content: flex-start; }
.mode-seg button { font-weight: 600; padding: 7px 14px; }
.map-wrap { display: grid; gap: 10px; }
.map-toolbar { display: grid; gap: 8px; }
.map-projects { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: thin; }
.mp-chip { flex: none; display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 12px 0 6px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--elev-1); font-weight: 500; white-space: nowrap; }
.mp-chip:first-child { padding-left: 12px; }
.mp-chip.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-2); }

/* ---------- toolbar menus (View / History / Export) ---------- */

        const vp2 = pg.page.getViewport({ scale: s2 });

  if (skipped.length) res.note += ` Page images not prepared for page(s) ${compactRange(skipped)} (image limit).`;
  if (scanned.length && !opts.vision) res.note += ` Page(s) ${compactRange(scanned)} have no text layer and page images are turned off — their content cannot be read.`;
  if (scanned.length === pages.length) res.status = opts.vision ? 'vision' : 'unreadable';

}
function compactRange(arr) {
  const a = [...new Set(arr)].sort((x, y) => x - y); const out = []; let s = a[0], p = a[0];
  for (let i = 1; i <= a.length; i++) { if (a[i] === p + 1) { p = a[i]; continue; } out.push(s === p ? `${s}` : `${s}–${p}`); s = p = a[i]; }
  return out.join(', ');
}

async function docxExtract(bytes) {
  const mammoth = await need('mammoth');
  let html = '', msgs = [];
  try { const ab = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength); const r = await mammoth.convertToHtml(typeof window === 'undefined' && typeof Buffer !== 'undefined' ? { buffer: Buffer.from(ab) } : { arrayBuffer: ab }); html = r.value; msgs = r.messages || []; }
  catch (e) { return { status: 'unreadable', note: 'Word file could not be opened (possibly password-protected or damaged).' }; }
  let text = htmlToText(html);
  let note = '';
  try {
    const JSZip = await need('jszip');
    const zip = await JSZip.loadAsync(bytes);
    const cx = zip.file('word/comments.xml');
    if (cx) {
      const xml = await cx.async('string');
      const comments = [...xml.matchAll(/<w:comment\b([^>]*)>([\s\S]*?)<\/w:comment>/g)].map(m => {
        const a = /w:author="([^"]*)"/.exec(m[1]); const d = /w:date="([^"]*)"/.exec(m[1]);
        const t = [...m[2].matchAll(/<w:t[^>]*>([^<]*)<\/w:t>/g)].map(x => x[1]).join('').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'");
        return `- [Comment by ${a ? a[1] : 'unknown'}${d ? ', ' + d[1].slice(0, 10) : ''}] ${t}`;
      });
      if (comments.length) text += `\n\n[Reviewer comments in this document — ${comments.length}]\n` + comments.join('\n');
    }
    const docXml = zip.file('word/document.xml');
    if (docXml) { const x = await docXml.async('string'); const ins = (x.match(/<w:ins\b/g) || []).length, del = (x.match(/<w:del\b/g) || []).length; if (ins + del) note = `Contains ${ins + del} tracked change(s); text shown with changes applied.`; }
  } catch {}
  return { status: text.trim() ? 'text' : 'unreadable', text, note: note || (text.trim() ? '' : 'No text found in this Word file.') };
}

async function sheetExtract(bytes, name) {
  const XLSX = await need('xlsx');
  let wb;
  try { wb = XLSX.read(bytes, { type: 'array', cellDates: true, cellNF: false, cellText: true, sheetStubs: false }); }
  catch (e) { return { status: 'unreadable', note: /password|encrypt/i.test(e && e.message || '') ? 'Password-protected workbook.' : 'Spreadsheet could not be opened.' }; }
  const parts = [];
  for (const sn of wb.SheetNames) {
    const ws = wb.Sheets[sn]; if (!ws || !ws['!ref']) continue;
    const hidden = (wb.Workbook && wb.Workbook.Sheets || []).find(s => s.name === sn)?.Hidden;
    const range = XLSX.utils.decode_range(ws['!ref']);
    const lines = [];
    const notes = [];
    for (let r = range.s.r; r <= Math.min(range.e.r, 20000); r++) {
      const cells = [];
      for (let c = range.s.c; c <= Math.min(range.e.c, 80); c++) {
        const addr = XLSX.utils.encode_cell({ r, c }); const cell = ws[addr];
        if (cell) {
          let v = cell.w !== undefined ? cell.w : (cell.v instanceof Date ? isoDate(cell.v) : cell.v);
          if (v !== undefined && v !== null && String(v).trim() !== '') cells.push(`${XLSX.utils.encode_col(c)}: ${String(v).replace(/\s+/g, ' ').trim()}`);
          if (cell.c && cell.c.length) notes.push(`${addr} (${cell.c.map(x => (x.a ? x.a + ': ' : '') + (x.t || '').replace(/\s+/g, ' ')).join(' / ')})`);
        }
      }
      if (cells.length) lines.push(`R${r + 1} | ${cells.join(' | ')}`);
    }
    if (!lines.length && !notes.length) continue;
    parts.push(`[Sheet: ${sn}]${hidden ? ' (hidden sheet)' : ''} — ${lines.length} non-empty rows\n` + lines.join('\n') + (notes.length ? `\n[Cell notes on ${sn}]\n` + notes.join('\n') : ''));
  }
  const text = parts.join('\n\n');
  return { status: text ? 'text' : 'unreadable', text, sheets: wb.SheetNames.length, note: text ? '' : 'Workbook has no readable cells.' };
}

async function pptxExtract(bytes) {
  const JSZip = await need('jszip');
  try {
    const zip = await JSZip.loadAsync(bytes);
    const slides = Object.keys(zip.files).filter(f => /^ppt\/slides\/slide\d+\.xml$/.test(f)).sort((a, b) => +a.match(/\d+/)[0] - +b.match(/\d+/)[0]);
    const parts = [];
    for (const f of slides) {
      const xml = await zip.file(f).async('string');
      const paras = xml.split(/<\/a:p>/).map(p => [...p.matchAll(/<a:t>([^<]*)<\/a:t>/g)].map(m => m[1]).join('')).filter(Boolean);
      parts.push(`[Slide ${f.match(/\d+/)[0]}]\n` + paras.join('\n'));
    }
    const text = xmlUnescape(parts.join('\n\n'));
    return { status: text.trim() ? 'text' : 'unreadable', text, note: '' };
  } catch { return { status: 'unreadable', note: 'PowerPoint file could not be opened.' }; }
}
const xmlUnescape = s => s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, '&');

function dxfExtract(bytes) {
  const s = decodeBytes(bytes, 'utf-8').replace(/\r\n/g, '\n').split('\n');
  const out = []; let ent = '';
  for (let i = 0; i + 1 < s.length; i += 2) {
    const code = s[i].trim(), val = s[i + 1];
    if (code === '0') ent = val.trim();
    if ((code === '1' || code === '3') && /^(TEXT|MTEXT|ATTRIB|ATTDEF|DIMENSION|MULTILEADER)$/.test(ent)) {
      const t = val.replace(/\\P/g, '\n').replace(/\\[A-Za-z][^;]*;/g, '').replace(/[{}]/g, '').trim(); if (t) out.push(t);
    }
  }
  const text = [...new Set(out)].join('\n');
  return { status: text ? 'text' : 'unreadable', text, note: 'Only text entities (notes, labels, title block attributes) were read; geometry is not interpreted.' };
}

async function imageToVisionBlob(blob, mime, maxBytes) {
  if (VISION_TYPES.includes(mime) && (!maxBytes || blob.size <= maxBytes)) return blob;
  // convert/downscale via canvas
  const bmp = await createImageBitmap(blob);
  const s = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
  const cv = mkCanvas(Math.round(bmp.width * s), Math.round(bmp.height * s));
  const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(bmp, 0, 0, cv.width, cv.height);
  return canvasToBlob(cv, 0.88);
}

/* Extract one attachment. att: {name, mime, bytes, email?}. Returns result object. */
async function extract(att, opts = {}) {
  const kind = att.email ? 'email' : kindOf(att.name, att.mime);
  const base = { kind, kindLabel: att.email ? 'Email' : (KIND_LABEL[kind] || 'File'), text: '', images: [], note: '', status: 'text' };
  try {
    switch (kind) {
      case 'email': return { ...base, ...emailAsAttachment(att.email) };
      case 'pdf': return { ...base, ...(await pdfExtract(att.bytes, opts)) };
      case 'image': {
        if (!opts.vision) return { ...base, status: 'skipped', note: 'Images are turned off for analysis.' };
        if (att.inline && att.bytes.length < 40000) return { ...base, status: 'skipped', note: 'Small inline image (likely a signature logo) — skipped.' };
        const blob = new Blob([att.bytes], { type: att.mime || guessMime(att.name) || 'image/png' });
        const vb = await imageToVisionBlob(blob, blob.type, opts.maxImageBytes);
        return { ...base, status: 'vision', images: [{ blob: vb, label: 'image' }] };
      }
      case 'tiff': case 'heic': return { ...base, status: 'unsupported', note: `${kind.toUpperCase()} images can't be read in the browser — save as JPG/PNG or PDF.` };
      case 'docx': return { ...base, ...(await docxExtract(att.bytes)) };
      case 'sheet': {
        if (extOf(att.name) === 'csv' || extOf(att.name) === 'tsv') { const t = decodeBytes(att.bytes, 'utf-8'); return { ...base, text: t.split(/\r?\n/).map((l, i) => l.trim() ? `R${i + 1} | ${l}` : '').filter(Boolean).join('\n') }; }
        return { ...base, ...(await sheetExtract(att.bytes, att.name)) };
      }
      case 'pptx': return { ...base, ...(await pptxExtract(att.bytes)) };
      case 'text': return { ...base, text: tidyText(decodeBytes(att.bytes, 'utf-8')) };
      case 'html': return { ...base, text: htmlToText(decodeBytes(att.bytes, 'utf-8')) };
      case 'rtf': return { ...base, text: rtfToText(bytesToBin(att.bytes)) };
      case 'dxf': return { ...base, ...dxfExtract(att.bytes) };
      case 'eml': { const em = parseEml(att.bytes); return { ...base, kind: 'email', kindLabel: 'Email', ...emailAsAttachment(em), nested: em }; }
      case 'msg': { const XLSX = await need('xlsx'); const em = readMsgFromCfb(XLSX.CFB.read(att.bytes, { type: 'array' })); return { ...base, kind: 'email', kindLabel: 'Email', ...emailAsAttachment(em), nested: em }; }
      case 'zip': return { ...base, status: 'container', note: 'ZIP archive — its files are listed separately.' };
      case 'cad': return { ...base, status: 'unsupported', note: 'CAD/model file — can\'t be read in the browser. Add a PDF print of the drawing instead.' };
      case 'legacy': return { ...base, status: 'unsupported', note: 'Legacy Office format (.doc/.ppt) — save as .docx/.pptx or PDF and add it again.' };
      case 'odt': return { ...base, status: 'unsupported', note: 'OpenDocument text — save as .docx or PDF.' };
      case 'archive': return { ...base, status: 'unsupported', note: '7z/RAR archives can\'t be opened here — extract the files and add them directly.' };
      case 'media': return { ...base, status: 'unsupported', note: 'Audio/video is not analysed.' };
      default: {
        const t = decodeBytes(att.bytes.slice(0, 200000), 'utf-8');
        const printable = (t.match(/[\p{L}\p{N}\p{P}\s]/gu) || []).length / Math.max(1, t.length);
        if (printable > 0.95) return { ...base, kind: 'text', kindLabel: 'Text', text: tidyText(t) };
        return { ...base, status: 'unsupported', note: 'Unrecognised file type — not analysed.' };
      }
    }
  } catch (e) {
    return { ...base, status: 'unreadable', note: (e && e.message) ? e.message : 'File could not be read.' };
  }
}
function emailAsAttachment(em) {
  const head = [`Subject: ${em.subject}`, `From: ${em.from}`, em.date ? `Date: ${em.date.slice(0, 16).replace('T', ' ')} UTC` : '', `To: ${em.to}`, em.cc ? `Cc: ${em.cc}` : ''].filter(Boolean).join('\n');
  return { status: 'text', text: head + '\n\n' + em.body, note: em.attachments.length ? `Contains ${em.attachments.length} attachment(s), listed separately.` : '' };
}

/* ---------- masking ---------- */
function makeMasker(myEmails) {
  const map = new Map(), rev = new Map(); let ne = 0, np = 0;
  const mine = new Set((myEmails || []).map(s => s.toLowerCase().trim()).filter(Boolean));
  const mask = s => String(s || '')
    .replace(/[\w.+'-]+@[\w-]+(\.[\w-]+)+/g, m => { const k = m.toLowerCase(); if (mine.has(k)) return '[my-email]'; if (!map.has(k)) { const t = `[email-${++ne}]`; map.set(k, t); rev.set(t, m); } return map.get(k); })
    .replace(/(\+?\d[\d ()\-]{7,}\d)/g, m => { if (m.replace(/\D/g, '').length < 9) return m; if (!map.has(m)) { const t = `[phone-${++np}]`; map.set(m, t); rev.set(t, m); } return map.get(m); });
  const unmask = s => typeof s === 'string' ? s.replace(/\[(email|phone)-\d+\]/g, t => rev.get(t) || t).replace(/\[my-email\]/g, 'me') : s;
  return { mask, unmask };
}

const T = () => E.todayISO();

  for (const t of St.tasks.values()) if (t.project) { const k = t.project.toLowerCase(); if (!set.has(k)) set.set(k, t.project); }

}
function nextRefs(n) {

function fmtDate(iso, opts = { day: 'numeric', month: 'short' }) {

}
async function bundleFromEmail(em, source, fileName) {

}
async function addAttTo(b, a, prefix, depth) {
  const kind = a.email ? 'email' : E.kindOf(a.name, a.mime);
  if (!a.email && (kind === 'eml' || kind === 'msg') && a.bytes && depth < 3) {
    try { a = { ...a, email: await parseEmailFile(a.bytes, kind) }; } catch {}
  }
  if (a.email) {
    b.atts.push(mkAtt({ name: prefix + a.name, mime: 'message/rfc822', size: a.size, email: a.email }));
    if (depth < 3) for (const c of a.email.attachments) await addAttTo(b, c, prefix + a.name + ' › ', depth + 1);
    (a.email.warnings || []).forEach(w => b.warnings.push(w));

      return;
    } catch { /* fall through and show as unreadable */ }
  }

}
function checkDuplicateEmail(b) {

async function extractPending() {

async function runAnalysis() {

  const queue = UI.staging.filter(b => b.state === 'ready' && !b.skip);
  let ok = 0;
  for (const b of queue) {
    if (!UI.analyzing) break;
    b.state = 'analyzing'; b.progress = 'Waiting for Claude…'; rerenderStaging();
    UI.abort = new AbortController();
    try {
      const rec = await analyzeBundle(b, UI.abort.signal, txt => { b.progress = txt; const n = $('#staging'); if (n) rerenderStaging(); });
      b.state = 'done'; ok++;
      const nt = rec.analysis.tasks.length;
      b.doneText = rec.analysis.actionRequired === false && !nt ? 'No action needed from you.' : `${nt} task${nt === 1 ? '' : 's'} proposed${rec.analysis.updates.length ? `, ${rec.analysis.updates.length} update${rec.analysis.updates.length > 1 ? 's' : ''} to existing tasks` : ''}.`;
    } catch (e) {
      if (e && e.code === 'cancelled') { b.state = 'ready'; break; }

  UI.analyzing = false; UI.abort = null;

  runHooks('analysed', ok);
}

  try {
    const seen = await loadSeen();
    const addr = g.address.trim().toLowerCase();
    const res = payloadOf(await gmCall('search_threads', { query: gmQuery(g), pageSize: 25, view: 'THREAD_VIEW_METADATA_ONLY' }));
    const cands = [];
    for (const th of res.threads || []) {
      let msgs = th.messages || [];
      if ((th.messageCount || msgs.length) > msgs.length) { try { msgs = payloadOf(await gmCall('get_thread', { threadId: th.id, messageFormat: 'METADATA_ONLY' })).messages || msgs; } catch {} }
      for (const m of msgs) {
        if (!m.id || seen[m.id] || UI.staging.some(b => b.gmailId === m.id)) continue;
        if (!hasAddr(m, addr)) continue;
        cands.push(m);
      }
    }
    cands.sort((a, b) => (a.internalDate || a.date || '').localeCompare(b.internalDate || b.date || ''));
    for (const m of cands.slice(0, 15)) {
      GM.status = 'checking'; GM.error = `Downloading ${added + 1} of ${Math.min(cands.length, 15)}…`; render();
      let b;
      try {
        const raw = payloadOf(await gmCall('get_message', { messageId: m.id, messageFormat: 'RAW' })).raw;
        if (!raw) throw { code: 'tool_error', message: 'empty message' };
        const em = E.unwrapForward(E.parseEml(E.b64urlToBytes(raw)));
        b = await bundleFromEmail(em, 'gmail', 'Forwarded · Gmail');
      } catch (e) {
        if (e && ['needs_reauth', 'server_not_connected', 'not_in_manifest', 'approval_required', 'consent_required', 'blocked_by_policy', 'selection_required'].includes(e.code)) throw e;
        // fallback: text only
        try {
          const pm = payloadOf(await gmCall('get_message', { messageId: m.id, messageFormat: 'PLAIN_TEXT' }));
          const em = E.unwrapForward({ subject: pm.subject || '', from: pm.sender || '', fromEmail: E.firstEmail(pm.sender || ''), to: (pm.toRecipients || []).join('; '), cc: (pm.ccRecipients || []).join('; '), date: pm.date || '', messageId: '', inReplyTo: '', references: '', convIndex: '', body: E.tidyText(pm.plaintextBody || pm.snippet || ''), attachments: [], warnings: [] });
          b = await bundleFromEmail(em, 'gmail', 'Forwarded · Gmail (text only)');
          const names = (pm.attachments || []).map(a => a.filename || a.name).filter(Boolean);
          b.warnings.push(`The full message could not be downloaded (it may be too large), so its attachments were not read${names.length ? ': ' + names.join(', ') : ''}. Save the original from Outlook and add it here instead.`);
        } catch { continue; }
      }
      b.gmailId = m.id; b.gmailUrl = m.viewUrl || '';
      UI.staging.push(b); checkDuplicateEmail(b); added++;
    }
    GM.status = 'idle'; GM.error = ''; GM.lastChecked = nowISO(); GM.newCount = added;
    if (manual || added) toast(added ? `${added} forwarded email${added > 1 ? 's' : ''} downloaded from Gmail.` : 'No new forwarded emails.', added ? { action: 'Show', fn: () => go('import') } : {});
  } catch (e) {
    GM.status = 'error'; GM.error = mcpErrorText(e);
    if (manual) toast(GM.error, { err: true });
  } finally { GM.busy = false; render(); }
  if (added) {
    await extractPending();
    if (gmCfg().autoAnalyse && St.sample && !UI.analyzing) runAnalysis();
  }
  return added;
}

function exportICS() {
  const open = [...St.tasks.values()].filter(t => t.status !== 'done' && t.deadline);
  if (!open.length) { toast('No open tasks with deadlines to export.'); return; }
  const icsEsc = s => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
  const fold = l => { const out = []; let s = l; while (s.length > 74) { out.push(s.slice(0, 74)); s = ' ' + s.slice(74); } out.push(s); return out.join('\r\n'); };
  const dt = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const ev = open.map(t => {
    const d = t.deadline.replace(/-/g, ''); const d2 = E.addDays(t.deadline, 1).replace(/-/g, '');
    return ['BEGIN:VEVENT', `UID:${t.id}@action-register`, `DTSTAMP:${dt}`, `DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${d2}`, `SUMMARY:${icsEsc(`${t.ref} Due: ${t.title}`)}`, `DESCRIPTION:${icsEsc([t.project ? 'Project: ' + t.project : '', t.ownership === 'waiting' ? 'Waiting on: ' + t.owner : '', t.nextStep ? 'Next step: ' + t.nextStep : '', t.sourceSubject ? 'Source: ' + t.sourceSubject : ''].filter(Boolean).join('\n'))}`, 'TRANSP:TRANSPARENT', 'END:VEVENT'].map(fold).join('\r\n');
  });
  offerFile(`action-register-deadlines-${stamp()}.ics`, ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Action Register//EN', 'CALSCALE:GREGORIAN', ...ev, 'END:VCALENDAR'].join('\r\n'));
}

async function importJSON(file) {
  try {
    const d = JSON.parse(await file.text());
    if (d.app !== 'action-register') throw new Error('Not an Action Register backup.');
    let nt = 0, ne = 0;
    for (const t of d.tasks || []) { if (t && t.id) { St.tasks.set(t.id, t); if (St.mode === 'db') await writeDoc(St.refs.tasks.doc(t.id), t); nt++; } }
    for (const e of d.emails || []) { if (e && e.id) { St.emails.set(e.id, e); if (St.mode === 'db') await writeDoc(St.refs.emails.doc(e.id), e); ne++; } }
    for (const [id, t] of Object.entries(d.texts || {})) await putTexts(id, t);
    for (const b of d.board || []) if (b && b.id) putBoard(b);
    for (const x of d.daily || []) if (x && x.id) putDaily(x);
    for (const n of COLS) for (const x of (d.cols && d.cols[n]) || []) if (x && x.id) colPut(n, x);
    if (d.layout) putLayout(mergeLayout({ off: { ...(d.layout.off || {}), ...St.layout.off }, size: { ...(d.layout.size || {}), ...St.layout.size } }));
    if (d.settings && !St.settings.setupDone) putSettings(mergeSettings(d.settings));
    if (St.mode !== 'db') saveLocal();
    toast(`Restored ${nt} tasks and ${ne} emails.`); render();
  } catch (e) { toast('Restore failed: ' + (e.message || 'invalid file'), { err: true }); }
}

  putLayout(mergeLayout()); UI.cvUndo = []; UI.cvRedo = [];
  if (St.mode !== 'db') { try { localStorage.removeItem(LS_TEXT); } catch {} }
  UI.confirm = null; toast('All data deleted.'); render();
}

function toast(msg, o = {}) {
  const box = $('#toasts'); while (box.children.length >= 2) box.firstElementChild.remove(); const t = document.createElement('div');
  t.className = 'toast' + (o.err ? ' err' : ''); t.setAttribute('role', o.err ? 'alert' : 'status');
  const span = document.createElement('span'); span.innerHTML = deco(esc(msg)); span.style.flex = '1'; t.append(span);
  if (o.action) { const b = document.createElement('button'); b.className = 'btn'; b.textContent = o.action; b.onclick = () => { o.fn(); t.remove(); }; t.append(b); }
  box.append(t); setTimeout(() => t.remove(), o.err ? 9000 : o.action ? 7000 : 3800);
}

// watch folder, backups, updates and the PIN lock need the desktop app.
const BG = { lastGmail: Date.now(), timer: null, notifiedDay: '', backupDay: '' };
const lsGet = k => { try { return localStorage.getItem(k) || ''; } catch { return ''; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const autoPrefs = () => Object.assign({ gmailEvery: 10, morning: true, morningAt: '07:30', backup: true }, St.settings.auto || {});
function deskNotify(title, body, view, id) {
  if (DESKTOP) { DK.call('sys:notify', { title, body, view, id }).catch(() => {}); return; }
  toast(title + (body ? ' — ' + body : ''));
}
function todaysNumbers() {
  const mine = [...St.tasks.values()].filter(t => t.status !== 'done' && isMine(t));
  return { overdue: mine.filter(t => t.deadline && t.deadline < T()).length, today: mine.filter(t => t.deadline === T()).length, review: counts().review };
}
async function backgroundTick() {
  if (!St.ready) return;
  const a = autoPrefs(), g = gmCfg();
  // 1. Gmail every N minutes (the check analyses new forwards itself when "Analyse automatically" is on)
  if (St.mcp && g.address && g.autoCheck && +a.gmailEvery > 0 && Date.now() - BG.lastGmail > a.gmailEvery * 60000 && !GM.busy && !UI.analyzing) {
    BG.lastGmail = Date.now();
    try { await checkGmail(false); } catch {}
  }
  // 2. morning reminder, once a day after the chosen time
  const now = new Date(), hm = now.toTimeString().slice(0, 5);
  if (a.morning && hm >= (a.morningAt || '07:30') && lsGet('ar-morning') !== T()) {
    lsSet('ar-morning', T());
    const n = todaysNumbers();
    if (n.overdue || n.today || n.review) deskNotify('Good morning — your day', [n.today ? `${n.today} due today` : '', n.overdue ? `${n.overdue} overdue` : '', n.review ? `${n.review} email${n.review > 1 ? 's' : ''} to review` : ''].filter(Boolean).join(' · '), 'todo');
  }
  // 3. daily backup (desktop)
  if (DESKTOP && a.backup && lsGet('ar-backup') !== T() && St.tasks.size) {
    lsSet('ar-backup', T());
    try { const data = await backupData(); await DK.call('backup:write', { name: `action-register-backup-${T()}.json`, text: JSON.stringify(data) }); } catch (e) { lsSet('ar-backup', ''); }
  }
}
HOOKS.analysed.push(ok => { if (ok && (document.hidden || !document.hasFocus())) deskNotify(`${ok} new email${ok > 1 ? 's' : ''} analysed`, 'Tasks are waiting for your review.', 'review'); });
HOOKS.ready.push(() => {
  clearInterval(BG.timer); BG.timer = setInterval(backgroundTick, 30000); setTimeout(backgroundTick, 4000);
  if (!DESKTOP) return;
  DK.on('quick-add', () => openQuickAdd());
  DK.on('gmail-check', () => checkGmail(true));
  DK.on('nav', ({ view, id }) => { if (view) go(view); if (id && St.tasks.has(id)) openDrawer('task', id); });
  DK.on('update:ready', ({ version }) => { UI.updateReady = version; render(); toast(`Version ${version} is ready to install.`, { action: 'Restart now', fn: () => DK.call('update:install') }); });
  DK.on('sample:usage', () => { DK.refresh(); });
  DK.on('import:file', async ({ name, path, data }) => {
    try {
      const f = new File([data], name);
      await intakeFiles([f]);
      await DK.call('watch:done', { path, ok: true });
      toast(`Imported ${name} from your watch folder.`, { action: 'Show', fn: () => go('import') });
      if (gmCfg().autoAnalyse && St.sample && !UI.analyzing) { await extractPending(); runAnalysis(); }
    } catch { DK.call('watch:done', { path, ok: false }).catch(() => {}); }
  });
  DK.call('watch:ready').catch(() => {});
  const st = DK.status(); if (st.update) UI.updateReady = st.update.version;
});

/* ---------- home: Today strip, morning briefing, risk radar ---------- */
const BRIEF = { running: false, error: '' };
const briefKey = () => 'brief-' + T();
const todayBrief = () => St.cols.prefs.get(briefKey()) || null;
function openMine() { return [...St.tasks.values()].filter(t => t.status !== 'done' && t.ownership !== 'fyi'); }
// Local rules that flag tasks likely to slip; Claude is not needed for these.
function riskList() {
  const out = [], today = T(), now = Date.now();
  const age = iso => iso ? Math.floor((now - new Date(iso)) / 864e5) : 0;
  for (const t of openMine()) {
    const d = t.deadline ? E.dayDiff(today, t.deadline) : null;
    const lastTouch = t.updatedAt || t.createdAt;
    if (d !== null && d < 0) out.push({ t, level: 3, why: `${-d} day${d === -1 ? '' : 's'} overdue` });
    else if (d !== null && d <= 2 && t.status === 'todo' && !subsDone(t)) out.push({ t, level: 2, why: d === 0 ? 'Due today and not started' : `Due in ${d} day${d > 1 ? 's' : ''}, not started` });
    if (t.status === 'blocked') out.push({ t, level: 2, why: 'Blocked' + (t.blockedReason ? ': ' + E.clip(t.blockedReason, 50) : '') });
    if ((t.ownership === 'waiting' || t.status === 'waiting') && age(lastTouch) >= 7) out.push({ t, level: 1, why: `Waiting on ${t.owner || 'others'} for ${age(lastTouch)} days` });
  }
  for (const d of colList('docreg')) if (/^[34]$/.test(String(d.code || '')) && !d.resubmitted && d.status !== 'closed') {
    const task = d.taskId && St.tasks.get(d.taskId);
    if (!task || task.status === 'done') out.push({ t: task || null, doc: d, level: 2, why: `${d.number || d.title} returned Code ${d.code} — no open resubmission task` });
  }
  const seen = new Set();
  return out.sort((a, b) => b.level - a.level).filter(r => { const k = (r.t ? r.t.id : r.doc.id) + r.why; if (seen.has(k)) return false; seen.add(k); return true; });
}
function localBrief() {
  const m = openMine().filter(t => isMine(t) && t.status !== 'waiting');
  const today = m.filter(t => t.deadline === T()), over = m.filter(t => t.deadline && t.deadline < T());
  const waiting = openMine().filter(t => t.ownership === 'waiting' || t.status === 'waiting');
  const lines = [];
  if (over.length) lines.push({ text: `${over.length} overdue: ${over.slice(0, 3).map(t => t.ref).join(', ')}${over.length > 3 ? '…' : ''}`, taskIds: over.slice(0, 3).map(t => t.id) });
  if (today.length) lines.push({ text: `Due today: ${today.slice(0, 3).map(t => E.clip(t.title, 50)).join('; ')}`, taskIds: today.slice(0, 3).map(t => t.id) });
  const top = m.filter(t => !today.includes(t) && !over.includes(t)).sort((a, b) => (PRIO_RANK[a.priority] ?? 2) - (PRIO_RANK[b.priority] ?? 2) || (a.deadline || '9').localeCompare(b.deadline || '9'))[0];
  if (top) lines.push({ text: `Next most important: ${E.clip(top.title, 70)}`, taskIds: [top.id] });
  if (waiting.length) lines.push({ text: `Waiting on others: ${[...new Set(waiting.map(t => t.owner || 'others'))].slice(0, 4).join(', ')}`, taskIds: waiting.slice(0, 3).map(t => t.id) });
  const rc = counts().review; if (rc) lines.push({ text: `${rc} analysed email${rc > 1 ? 's' : ''} waiting for your review`, taskIds: [] });
  return { headline: lines.length ? 'Here is your day' : 'Nothing urgent today', bullets: lines, by: 'local', at: nowISO() };
}
async function makeBrief(manual) {
  if (BRIEF.running) return;
  if (!St.sample) { colPut('prefs', { id: briefKey(), ...localBrief() }); render(); return; }
  BRIEF.running = true; BRIEF.error = ''; render();
  try {
    const tasks = openMine().slice(0, 120).map(t => JSON.stringify({ id: t.id, ref: t.ref, title: t.title, project: t.project || '', status: t.status, priority: t.priority, deadline: t.deadline, owner: t.ownership === 'mine' ? 'me' : t.owner, waitingSince: (t.ownership === 'waiting' || t.status === 'waiting') ? (t.updatedAt || '').slice(0, 10) : undefined, items: subsOf(t).length ? `${subsDone(t)}/${subsOf(t).length}` : undefined })).join('\n');
    const risks = riskList().slice(0, 10).map(r => '- ' + (r.t ? r.t.ref + ' ' : '') + r.why).join('\n');
    const prompt = `You are the morning assistant of ${St.settings.me.name || 'a mechanical design engineer'} (${St.settings.me.role || 'water and wastewater treatment'}). Today is ${T()}.\nOpen tasks (one JSON object per line):\n${tasks || '(none)'}\n\nAlready flagged risks:\n${risks || '(none)'}\n\nWrite a briefing of at most 5 short bullets: what matters most today, what is overdue or at risk, and who the user is waiting on. Be specific (refs, documents, people). Do not invent anything that is not in the data.\nReply with JSON only: {"headline":"<one line>","bullets":[{"text":"<bullet>","taskIds":["<id>"]}]}`;
    const ans = await St.sample.json(prompt, { modelTier: 'quick' });
    const bullets = (ans && Array.isArray(ans.bullets) ? ans.bullets : []).filter(b => b && b.text).slice(0, 6).map(b => ({ text: E.clip(String(b.text), 220), taskIds: (Array.isArray(b.taskIds) ? b.taskIds : []).map(String).filter(id => St.tasks.has(id)).slice(0, 4) }));
    colPut('prefs', { id: briefKey(), ...(bullets.length ? { headline: E.clip(String(ans.headline || 'Your day'), 120), bullets, by: 'claude', at: nowISO() } : localBrief()) });
  } catch (e) {
    BRIEF.error = 'Claude could not write the briefing (' + ((e && e.code) || 'error') + '). Showing the basic one.';
    colPut('prefs', { id: briefKey(), ...localBrief() });
  } finally { BRIEF.running = false; render(); }
}

/* ---------- command palette (Ctrl+K) ---------- */
const PAL = { open: false, q: '', i: 0, items: [] };
function paletteItems(q) {
  const nq = E.normMatch(q), out = [];
  const add = (group, label, run, hint) => out.push({ group, label, run, hint });
  const views = [['todo', 'To-do'], ['daily', 'Daily'], ['review', 'Review'], ['import', 'Add emails'], ['emails', 'Emails'], ['docs', 'Documents'], ['insights', 'Insights'], ['tools', 'Tools'], ['setup', 'Setup']];
  const acts = [
    ['New task', () => ACT['new-task']()], ['Quick add for today', () => openQuickAdd()], ['Check Gmail now', () => checkGmail(true)],
    ['Focus mode', () => openFocus()], ['Morning briefing — write again', () => { go('todo'); makeBrief(true); }],
    ['Privacy mode on/off', () => togglePrivacy()], ['Keyboard shortcuts', () => openShortcuts()],
    ['Weekly report', () => { UI.insTab = 'reports'; go('insights'); }], ['Timesheet', () => { UI.insTab = 'time'; go('insights'); }],
    ['Engineering calculators', () => { UI.toolTab = 'calc'; go('tools'); }], ['Compare datasheets / offers', () => { UI.toolTab = 'compare'; go('tools'); }],
    ['CRS responses', () => { UI.toolTab = 'crs'; go('tools'); }], ['Document register', () => { UI.docTab = 'register'; go('docs'); }],
    ['Full backup (.json)', () => exportJSON()], ['Recycle bin', () => { go('setup'); setTimeout(() => document.getElementById('set-bin')?.scrollIntoView(), 80); }],
    ...(DESKTOP && DK.status().desktop && DK.status().desktop.locked ? [['Lock now', () => showLock()]] : []),
  ];
  for (const [v, l] of views) if (!nq || E.normMatch('go to ' + l).includes(nq)) add('Go to', l, () => go(v));
  for (const [l, f] of acts) if (!nq || E.normMatch(l).includes(nq)) add('Actions', l, f);
  if (q.trim().length > 2 && St.sample) add('Ask Claude', `Ask: “${q.trim()}”`, () => openAsk(q.trim()));
  if (nq) {
    const words = nq.split(' ');
    const hit = s => { const h = E.normMatch(s); return words.every(w => h.includes(w)); };
    for (const t of St.tasks.values()) if (hit([t.ref, t.title, t.project, topicOf(t), t.owner].join(' '))) add('Tasks', `${t.ref} · ${E.clip(t.title, 80)}`, () => openDrawer('task', t.id), t.status === 'done' ? 'done' : t.project || '');
    for (const e of St.emails.values()) if (hit([e.subject, e.from].join(' '))) add('Emails', E.clip(e.subject || '(no subject)', 80), () => openDrawer('email', e.id), fmtDate(e.date || e.importedAt));
    for (const p of projectsList()) if (hit(p)) add('Projects', p, () => { UI.mapFocus = 'p:' + E.normMatch(p); UI.todoMode = 'map'; UI.map.fitted = false; go('todo'); }, 'canvas');
  }
  return out.slice(0, 40);
}
function renderPalette() {
  const m = $('#modal'); PAL.items = paletteItems(PAL.q); PAL.i = Math.min(PAL.i, Math.max(0, PAL.items.length - 1));
  let g = '';
  const rows = PAL.items.map((it, i) => { const head = it.group !== g ? `<div class="pal-g">${esc(it.group)}</div>` : ''; g = it.group; return head + `<button class="pal-item ${i === PAL.i ? 'on' : ''}" data-act="pal-run" data-i="${i}"><span dir="auto">${esc(it.label)}</span>${it.hint ? `<span class="small muted">${esc(it.hint)}</span>` : ''}</button>`; }).join('');
  const body = `<div class="card palette" role="dialog" aria-label="Search and commands"><input class="input" id="pal-in" placeholder="Search tasks, emails, projects, or type a command…" value="${esc(PAL.q)}" autocomplete="off" dir="auto"><div class="pal-list" id="pal-list">${rows || '<p class="small muted" style="padding:10px">Nothing found.</p>'}</div><div class="small muted pal-foot">↑ ↓ to move · Enter to open · Esc to close</div></div>`;
  if (PAL.open && $('#pal-in')) { $('#pal-list').innerHTML = deco(rows || '<p class="small muted" style="padding:10px">Nothing found.</p>'); return; }
  m.innerHTML = deco(body); m.hidden = false; m.classList.add('top'); PAL.open = true;
  const inp = $('#pal-in'); inp.focus(); inp.setSelectionRange(PAL.q.length, PAL.q.length);
}
function openPalette() { PAL.q = ''; PAL.i = 0; PAL.open = false; renderPalette(); }
function closePalette() { PAL.open = false; const m = $('#modal'); m.hidden = true; m.classList.remove('top'); }
function runPal(i) { const it = PAL.items[i]; if (!it) return; closePalette(); it.run(); }
document.addEventListener('input', e => { if (e.target && e.target.id === 'pal-in') { PAL.q = e.target.value; PAL.i = 0; renderPalette(); } });
document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); PAL.open && !$('#modal').hidden ? closePalette() : openPalette(); return; }
  if (!PAL.open) return;
  if (e.key === 'Escape') { e.preventDefault(); closePalette(); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); PAL.i = Math.min(PAL.items.length - 1, PAL.i + 1); renderPalette(); $('.pal-item.on')?.scrollIntoView({ block: 'nearest' }); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); PAL.i = Math.max(0, PAL.i - 1); renderPalette(); $('.pal-item.on')?.scrollIntoView({ block: 'nearest' }); }
  else if (e.key === 'Enter') { e.preventDefault(); runPal(PAL.i); }
});
Object.assign(ACT, { palette: () => openPalette(), 'pal-run': el => runPal(+el.dataset.i) });

const recurList = () => Array.isArray(St.settings.recurring) ? St.settings.recurring : [];
function recurDue(r, day) {
  if (r.last === day || !isWorkingDay(day) && r.freq !== 'weekly' && r.freq !== 'monthly') return false;
  const d = new Date(day + 'T12:00:00');
  if (r.freq === 'workdays') return isWorkingDay(day);
  if (r.freq === 'weekly') return d.getDay() === +r.weekday;
  if (r.freq === 'monthly') return d.getDate() === Math.min(+r.monthday || 1, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate());
  return false;
}
function runRecurring() {
  const day = T(); const made = [];

    const t = makeTask({ title: r.title, project: r.project || '', priority: r.priority || 'medium', source: 'recurring', days: [day], deadline: day, deadlineBasis: 'explicit', history: [{ at: nowISO(), text: `Created by the recurring task “${r.title}”` }] });

}

// List prices per million tokens (Anthropic API, October 2026). Cache writes are estimated at 1.25× input.
const PRICES = { 'claude-opus-5-5': { in: 4, out: 20, cr: 0.2 }, 'claude-sonnet-5-5': { in: 2, out: 10, cr: 0.2 }, 'claude-haiku-5-5': { in: 0.1, out: 0.5, cr: 0.01 } };
function usageCost(model, u) { const p = PRICES[Object.keys(PRICES).find(k => String(model).startsWith(k))]; if (!p) return null; return (u.input * p.in + u.output * p.out + u.cacheRead * p.cr + u.cacheWrite * p.in * 1.25) / 1e6; }
function usageMonth(month) { const m = ((DK && DK.status().usage) || {})[month] || {}; let calls = 0, cost = 0, unknown = false; for (const [model, u] of Object.entries(m)) { calls += u.calls; const c = usageCost(model, u); if (c === null) unknown = true; else cost += c; } return { rows: m, calls, cost, unknown }; }
function usageHTML() {
  const month = new Date().toISOString().slice(0, 7), u = usageMonth(month);
  return `<section class="card pad set-sec" id="set-usage" data-sec="Usage and cost"><div class="section-title"><h2>Claude usage this month</h2></div>
    ${u.calls ? `<table class="tbl"><thead><tr><th>Model</th><th>Calls</th><th>Input</th><th>Output</th><th>Cached read</th><th>Estimated cost</th></tr></thead><tbody>${Object.entries(u.rows).map(([m, x]) => { const c = usageCost(m, x); return `<tr><td class="mono">${esc(m)}</td><td class="num">${x.calls}</td><td class="num">${(x.input / 1000).toFixed(1)}k</td><td class="num">${(x.output / 1000).toFixed(1)}k</td><td class="num">${(x.cacheRead / 1000).toFixed(1)}k</td><td class="num">${c === null ? '—' : '$' + c.toFixed(2)}</td></tr>`; }).join('')}</tbody></table>
    <p class="small muted" style="margin:0">About <b>$${u.cost.toFixed(2)}</b> so far this month${u.unknown ? ' (some models have no price on file)' : ''}. Estimate from list prices; your Anthropic invoice is the exact figure (console.anthropic.com › Billing).</p>` : '<p class="small muted" style="margin:0">No Claude calls yet this month.</p>'}
  </section>`;
}
