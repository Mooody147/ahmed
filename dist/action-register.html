/* ---------- canvas extras: project bands, minimap, menus, export, presentation ---------- */
// Project bands: a soft coloured area behind each project's whole branch.
function projectBands(M) {
  const out = [];
  for (const P of M.projects) {
    if (P.x === undefined) continue;
    let x0 = P.x, y0 = P.y, x1 = P.x + P.w, y1 = P.y + P.h;
    const walk = n => { x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y); x1 = Math.max(x1, n.x + n.w); y1 = Math.max(y1, n.y + n.h); (n.kids || []).forEach(walk); };
    walk(P);
    out.push({ id: P.id, x: x0 - 14, y: y0 - 12, w: x1 - x0 + 28, h: y1 - y0 + 24, hue: P.hue, label: P.label });
  }
  // neighbouring bands never overlap: split the gap between them
  const byY = [...out].sort((a, b) => a.y - b.y);
  for (let i = 1; i < byY.length; i++) {
    const a = byY[i - 1], b = byY[i], ov = a.y + a.h + 4 - b.y;
    if (ov > 0 && a.x < b.x + b.w && b.x < a.x + a.w) { const cut = ov / 2; a.h -= cut; b.y += cut; b.h -= cut; }
  }
  return out;
}

/* --- minimap --- */
function drawMinimap() {
  const c = $('#minimap'), M = UI.mapLayout, vp = $('#map-vp'); if (!c || !M || !vp) return;
  const ctx = c.getContext && c.getContext('2d'); if (!ctx) return;
  const W = c.width, H = c.height, s = Math.min(W / M.w, H / M.h), ox = (W - M.w * s) / 2, oy = (H - M.h * s) / 2;
  const css = getComputedStyle(document.documentElement), v = k => css.getPropertyValue(k).trim();
  const X = x => ox + (x - M.x0) * s, Y = y => oy + (y - M.y0) * s;
  ctx.clearRect(0, 0, W, H);
  for (const b of projectBands(M)) { ctx.fillStyle = `hsla(${b.hue},55%,55%,.18)`; ctx.fillRect(X(b.x), Y(b.y), b.w * s, b.h * s); }
  for (const n of M.nodes) {
    ctx.fillStyle = n.type === 'root' ? v('--accent') || '#0A6B74' : n.type === 'task' ? (n.t.status === 'done' ? 'rgba(128,128,128,.45)' : `hsl(${n.hue},45%,48%)`) : `hsl(${n.hue ?? 186},50%,40%)`;
    ctx.fillRect(X(n.x), Y(n.y), Math.max(1.5, n.w * s), Math.max(1.5, n.h * s));
  }
  for (const el of boardEls()) { const b = elBox(el); if (!b.w) continue; ctx.fillStyle = el.type === 'sticky' ? '#E8C547' : 'rgba(128,128,128,.5)'; ctx.fillRect(X(b.x), Y(b.y), Math.max(1.5, b.w * s), Math.max(1.5, b.h * s)); }
  // the part of the canvas on screen
  const k = UI.map.k, vx = -UI.map.x / k, vy = -UI.map.y / k, vw = vp.clientWidth / k, vh = vp.clientHeight / k;
  ctx.strokeStyle = v('--accent') || '#0A6B74'; ctx.lineWidth = 2; ctx.strokeRect(X(vx), Y(vy), vw * s, vh * s);
  c._map = { s, ox, oy };
}
function minimapMove(e) {
  const c = $('#minimap'), M = UI.mapLayout, vp = $('#map-vp'); if (!c || !c._map || !M || !vp) return;
  const r = c.getBoundingClientRect(), { s, ox, oy } = c._map;
  const wx = ((e.clientX - r.left) * (c.width / r.width) - ox) / s + M.x0, wy = ((e.clientY - r.top) * (c.height / r.height) - oy) / s + M.y0;
  UI.map.x = vp.clientWidth / 2 - wx * UI.map.k; UI.map.y = vp.clientHeight / 2 - wy * UI.map.k; applyCam(false);
}
HOOKS.afterRender.push(() => {

const xesc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
function wrapText(text, maxChars, maxLines) {
  const words = String(text || '').split(/\s+/).filter(Boolean), lines = []; let cur = '';

    if (lines.length === maxLines) break;
  }
  if (cur && lines.length < maxLines) lines.push(cur);
  if (lines.length === maxLines && words.join(' ').length > lines.join(' ').length) lines[maxLines - 1] = lines[maxLines - 1].replace(/.{0,2}$/, '…');
  return lines;
}
function svgText(x, y, lines, size, color, weight, lh) {

}
function mapSVG(M) {

  parts.push(svgText(24, 36, [`Action Register — ${UI.mapFocus === 'all' ? 'All projects' : (M.projects[0] || {}).label || ''}`], 22, '#15201E', 600));
  parts.push(svgText(W - 24 - 220, 36, [`Exported ${fmtDate(T(), { day: 'numeric', month: 'short', year: 'numeric' })}`], 13, '#5B6B68'));
  parts.push(`<g transform="translate(${ox},${oy})">`);
  if (UI.mapBands !== false) for (const b of projectBands(M)) parts.push(`<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="26" fill="hsl(${b.hue},60%,96%)" stroke="hsl(${b.hue},45%,82%)"/>`);
  for (const el of boardEls()) {
    const e = liveEl(el), col = colorCss(e.color).startsWith('var') ? '#15201E' : e.color;
    if (e.type === 'frame') parts.push(`<rect x="${e.x}" y="${e.y}" width="${e.w}" height="${e.h}" rx="10" fill="none" stroke="${e.color === 'ink' ? '#8EC5FF' : col}" stroke-width="2" stroke-dasharray="8 6"/>` + svgText(e.x + 10, e.y + 22, [e.text || 'Frame'], 14, '#334', 600));
    if (e.type === 'sticky') parts.push(`<rect x="${e.x}" y="${e.y}" width="${e.w}" height="${e.h}" rx="4" fill="${e.color === 'ink' ? '#FFD966' : col}"/>` + svgText(e.x + 12, e.y + 26, wrapText(e.text, Math.max(8, (e.w - 24) / 7.6), Math.floor((e.h - 16) / 19)), 14, '#1F1A00'));
    if (e.type === 'text') parts.push(svgText(e.x, e.y + (e.size || 20), wrapText(e.text, Math.max(6, e.w / ((e.size || 20) * 0.55)), 12), e.size || 20, col));
    if (e.type === 'shape') {

      parts.push(`${sh} fill="none" stroke="${col}" stroke-width="2"/>` + svgText(e.x + e.w / 2 - Math.min(e.w / 2 - 8, (e.text || '').length * 3.6), e.y + e.h / 2 + 5, wrapText(e.text, Math.max(6, (e.w - 20) / 7.6), 3), 14, '#15201E'));

// Register rows ('docreg' collection), one per document number:
// { id, number, title, project, revision, code, status, by, date, emailId, taskId, revs: [{ rev, code, status, date, by, emailId }], closed }
const DOC_STATUS = { submitted: 'Submitted', returned: 'Returned', approved: 'Approved', rejected: 'Rejected', requested: 'Requested', for_info: 'For information' };
const DOC_CODE = { 1: 'Code 1 — Approved', 2: 'Code 2 — Approved with comments', 3: 'Code 3 — Revise and resubmit', 4: 'Code 4 — Rejected' };
const docKey = n => E.normMatch(n || '').replace(/\s+/g, '');
const revRank = r => { const s = String(r || '').trim().toUpperCase(); if (/^\d+$/.test(s)) return 100 + +s; if (/^[A-Z]$/.test(s)) return s.charCodeAt(0) - 64; return 0; };
function upsertDoc(d, e, project) {
  const key = docKey(d.number || d.title); if (!key) return;
  const cur = colList('docreg').find(x => docKey(x.number || x.title) === key);
  const date = d.date || dayOf(e.date) || T();
  const rev = { rev: d.revision || '', code: d.code || '', status: d.status || '', date, by: d.by || '', emailId: e.id };
  const task = [...St.tasks.values()].find(t => (t.emailIds || []).includes(e.id) && d.number && E.normMatch([t.title, t.action, subsOf(t).map(x => x.text).join(' ')].join(' ')).includes(E.normMatch(d.number)));
  if (!cur) { colPut('docreg', { id: E.uid('dr'), number: d.number || '', title: d.title || '', project: project || '', revision: rev.rev, code: rev.code, status: rev.status, by: rev.by, date, emailId: e.id, taskId: task ? task.id : '', revs: [rev], createdAt: nowISO() }); return; }
  const x = clone(cur);
  if (!(x.revs || []).some(r => r.emailId === e.id && r.rev === rev.rev && r.status === rev.status)) x.revs = [...(x.revs || []), rev];
  const latest = [...x.revs].sort((a, b) => (a.date || '').localeCompare(b.date || '') || revRank(a.rev) - revRank(b.rev)).pop();
  Object.assign(x, { revision: latest.rev || x.revision, code: latest.code, status: latest.status || x.status, by: latest.by || x.by, date: latest.date, emailId: latest.emailId, title: x.title || d.title || '', project: x.project || project || '' });
  // a new revision submitted after a Code 3/4 counts as the resubmission
  x.resubmitted = latest.status === 'submitted' && x.revs.some(r => /^[34]$/.test(r.code) && revRank(r.rev) < revRank(latest.rev));
  if (task && !x.taskId) x.taskId = task.id;
  colPut('docreg', x);
}

const TAG_RE = /\b([A-Z]{1,4})-?(\d{2,4}[A-Z]?)\b/g;
function equipmentTags() {
  const tags = new Map();

/* --- evidence viewer: the source text with the quote highlighted --- */
function findQuote(text, quote) {
  const q = String(quote || '').trim(); if (!q || !text) return null;
  let i = text.indexOf(q); if (i >= 0) return [i, i + q.length];
  // tolerant match: ignore case and whitespace differences
  const map = [], norm = []; for (let k = 0; k < text.length; k++) { const c = text[k]; if (/\s/.test(c)) { if (norm[norm.length - 1] !== ' ') { norm.push(' '); map.push(k); } } else { norm.push(c.toLowerCase()); map.push(k); } }
  const nq = q.replace(/\s+/g, ' ').toLowerCase(), ns = norm.join('');
  i = ns.indexOf(nq); if (i < 0) { const part = nq.slice(0, Math.min(60, nq.length)); i = ns.indexOf(part); if (i < 0) return null; return [map[i], map[Math.min(map.length - 1, i + part.length - 1)] + 1]; }
  return [map[i], map[Math.min(map.length - 1, i + nq.length - 1)] + 1];
}
async function viewEvidence(emailId, src, name, quote) {
  const e = St.emails.get(emailId), m = $('#modal'); if (!e) return;
  const data = await getTexts(emailId);
  let text = '', label = '';
  if (data) {
    const att = (data.atts || []).find(a => a.name && name && a.name === name) || (src && src !== 'BODY' && (data.atts || []).find(a => findQuote(a.text, quote)));
    if (att && src !== 'BODY') { text = att.text || ''; label = att.name; } else { text = data.body || ''; label = 'Email body'; }
    if (!findQuote(text, quote)) { const other = [{ name: 'Email body', text: data.body }, ...(data.atts || [])].find(x => findQuote(x.text, quote)); if (other) { text = other.text; label = other.name; } }
  }
  const hit = findQuote(text, quote);
  const W = 1600, body = !text ? '<p class="muted">The full text of this email was not kept (Setup → Privacy controls whether email text is stored), so only the quote can be shown.</p>'
    : hit ? `<pre class="src-text" dir="auto">${esc(text.slice(Math.max(0, hit[0] - W), hit[0]))}<mark id="ev-mark">${esc(text.slice(hit[0], hit[1]))}</mark>${esc(text.slice(hit[1], hit[1] + W))}</pre>`
    : `<p class="small muted">The exact quote was not found in the stored text (it may come from a page image).</p><pre class="src-text" dir="auto">${esc(E.clip(text, 3000))}</pre>`;
  m.innerHTML = deco(`<div class="card pad ev-viewer" role="dialog" aria-label="Evidence in source"><div class="row ev-head"><b dir="auto">🔎 ${esc(label || 'Source')}</b><span class="small muted ev-sub" dir="auto">${esc(e.subject || '')}</span><span class="spacer"></span><button class="btn ghost sm" data-act="open-email" data-id="${esc(e.id)}">Open email</button><button class="icon-btn" data-act="close-modal" aria-label="Close">${I.x}</button></div>
    <blockquote dir="auto">${esc(quote)}</blockquote>${body}</div>`);
  m.hidden = false; setTimeout(() => { const k = $('#ev-mark'); if (k) k.scrollIntoView({ block: 'center' }); }, 30);
}

const G = 9.80665;
const CALC = {
  // water properties (1–100 °C): density (Tanaka 2001 fit) and vapour pressure (Antoine, mmHg → kPa)
  rho: T => 1000 * (1 - ((T + 288.9414) / (508929.2 * (T + 68.12963))) * (T - 3.9863) ** 2),
  pv: T => 0.133322 * Math.pow(10, 8.07131 - 1730.63 / (233.426 + T)),
  patm: z => 101.325 * Math.pow(1 - 2.25577e-5 * z, 5.25588), // kPa at altitude z (m)
  pipe({ q, d, l, eps, nu, k }) {
    const D = d / 1000, A = Math.PI * D * D / 4, v = q / 3600 / A, Re = v * D / (nu * 1e-6);
    const f = Re < 2300 ? 64 / Re : 0.25 / Math.log10((eps / 1000) / (3.7 * D) + 5.74 / Math.pow(Re, 0.9)) ** 2;
    const hv = v * v / (2 * G), hf = f * (l / D) * hv, hm = (k || 0) * hv;
    return { v, Re, f, hf, hm, h: hf + hm, per100: l ? 100 * hf / l : 0, regime: Re < 2300 ? 'laminar' : Re < 4000 ? 'transitional' : 'turbulent' };
  },
  pump({ q, h, sg, ep, em }) {
    const ph = 1000 * sg * G * (q / 3600) * h / 1000, shaft = ph / (ep / 100), input = shaft / (em / 100);
    const IEC = [0.37, 0.55, 0.75, 1.1, 1.5, 2.2, 3, 4, 5.5, 7.5, 11, 15, 18.5, 22, 30, 37, 45, 55, 75, 90, 110, 132, 160, 200, 250, 315, 355, 400, 450, 500, 560, 630];
    const need = shaft * (shaft < 22 ? 1.15 : 1.1);
    return { ph, shaft, input, need, motor: IEC.find(x => x >= need) || null };
  },
  npsh({ z, t, hs, hf, npshr }) {
    const pa = CALC.patm(z), pv = CALC.pv(t), rho = CALC.rho(t);
    const ha = pa * 1000 / (rho * G), hvp = pv * 1000 / (rho * G), npsha = ha - hvp + hs - hf;
    return { pa, pv, rho, ha, hvp, npsha, margin: npshr ? npsha - npshr : null, ratio: npshr ? npsha / npshr : null };
  },
  // Metcalf & Eddy: Pw = w·R·T1 / (29.7·n·e) · [(p2/p1)^0.283 − 1]
  blower({ qn, t, z, dp, e }) {
    const w = qn * 1.293 / 3600, T1 = t + 273.15, p1 = CALC.patm(z), p2 = p1 + dp, n = 0.283;
    const pw = (w * 8.314 * T1) / (29.7 * n * (e / 100)) * (Math.pow(p2 / p1, n) - 1);
    return { w, p1, p2, ratio: p2 / p1, pw };
  },
};

  pump: { label: '⚙️ Pump power & motor size', fields: [['q', 'Flow', 'm³/h', 410], ['h', 'Total head', 'm', 14.5], ['sg', 'Specific gravity', '—', 1.0], ['ep', 'Pump efficiency', '%', 78], ['em', 'Motor efficiency', '%', 94]],
